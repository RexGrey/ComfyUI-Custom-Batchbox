  <path class="active-line" d="M570 585 C720 585, 920 360, 1040 375"/>
  <path class="api-line" d="M1000 375 C1030 375, 1030 585, 1040 585"/>
  <path class="active-line" d="M1000 595 C1015 595, 1025 595, 1040 595"/>
